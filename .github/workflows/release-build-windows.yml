name: release-build-windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: personal-reader
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc

      - name: Configure MSVC environment
        uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc

      - name: Build Windows release package
        shell: bash
        env:
          LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
        run: |
          CODEX_REPO_ROOT="$GITHUB_WORKSPACE" \
            python3 "$GITHUB_WORKSPACE/scripts/build_codex_package.py" \
            --target x86_64-pc-windows-msvc \
            --cargo-profile release \
            --package-dir "$RUNNER_TEMP/codex-windows-x64"

      - name: Upload Windows Release artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-windows-x64-release
          path: ${{ runner.temp }}/codex-windows-x64
          if-no-files-found: error
